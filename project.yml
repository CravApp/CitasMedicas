name: CitasMedicas
options:
  bundleIdPrefix: com.citasmedicas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CitasMedicas:
    type: application
    platform: iOS
    sources:
      - path: CitasMedicas
        excludes: ["Resources/Info.plist", "Resources/Fonts/README.txt"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.citasmedicas.app
        INFOPLIST_FILE: CitasMedicas/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
schemes:
  CitasMedicas:
    build:
      targets:
        CitasMedicas: all
